<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autodiagnóstico del negocio · SumaTips</title>
<style>
:root{--bg:#fff;--surface:#F3F7FC;--text:#0B2A6B;--muted:#4A5F85;--blue:#1585C6;--gold:#E0A526;--line:#D5E0EF;--red:#C93636;--amb:#C98A0A;--grn:#237F4B}
@media (prefers-color-scheme:dark){:root{--bg:#081A3F;--surface:#0E2656;--text:#EAF1FF;--muted:#A9BBDD;--blue:#4DB3EE;--line:#1D3A75;--red:#FF7676;--amb:#F0B94A;--grn:#5FD08E}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:0 20px 56px}
header{display:flex;align-items:center;gap:14px;padding:18px 0;border-bottom:1px solid var(--line);margin-bottom:28px}
.logo{background:#fff;border-radius:12px;padding:4px;width:84px;flex:none}
.logo img{display:block;width:100%;height:auto}
header b{font-size:1.05rem}header span{display:block;color:var(--muted);font-size:.9rem}
h1{font-size:clamp(1.9rem,6vw,2.8rem);line-height:1.15;margin:0 0 16px;letter-spacing:-.02em}
h2{font-size:1.5rem;margin:0 0 6px}
p{margin:0 0 1em;max-width:62ch}.muted{color:var(--muted)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 24px}
.bar i{display:block;height:100%;background:var(--gold);transition:width .3s}
fieldset{border:0;border-bottom:1px solid var(--line);margin:0;padding:18px 0}
legend{font-weight:700;padding:0;margin-bottom:10px}
.opts{display:grid;gap:8px}
@media(min-width:600px){.opts{grid-template-columns:repeat(3,1fr)}}
.opts label{display:block;cursor:pointer}
.opts input{position:absolute;opacity:0}
.opts span{display:block;text-align:center;padding:10px 12px;border:2px solid var(--line);border-radius:10px;font-size:.95rem}
.opts input:checked+span{border-color:var(--blue);background:var(--surface);font-weight:700}
.opts input:focus-visible+span,.btn:focus-visible,input[type=text]:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn{display:inline-block;border:0;cursor:pointer;background:var(--gold);color:#0B2A6B;font:inherit;font-weight:700;padding:13px 24px;border-radius:99px;text-decoration:none}
.btn.alt{background:transparent;color:var(--text);border:2px solid var(--blue)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.nav{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}
input[type=text]{width:100%;max-width:420px;padding:12px 14px;border:2px solid var(--line);border-radius:10px;font:inherit;background:var(--bg);color:var(--text);margin:6px 0 22px}
.total{background:var(--surface);border-left:6px solid var(--gold);padding:20px 24px;border-radius:6px;margin:12px 0 28px}
.total big{font-size:2.6rem;font-weight:800;line-height:1}
.area{padding:16px 0;border-bottom:1px solid var(--line)}
.area .top{display:flex;justify-content:space-between;gap:12px;font-weight:700}
.meter{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0}
.meter i{display:block;height:100%}
.tag{font-weight:800}
.area p{margin:0;color:var(--muted)}
.send{margin-top:28px;padding-top:24px;border-top:1px solid var(--line)}
footer{margin-top:36px;color:var(--muted);font-size:.9rem}
@media print{.nav,.send .btn{display:none}body{background:#fff;color:#000}}
</style>
</head>

var A=[
{n:"Finanzas y caja",q:["Sé cuánto dinero entra y cuánto sale de mi negocio cada semana.","Separo el dinero del negocio de mis gastos personales.","Conozco el costo de cada producto o servicio que vendo.","Sé cuál es mi ganancia real después de pagar todos los gastos.","Reviso mis precios cuando suben los costos o cambia el dólar.","Llevo un registro de lo que me deben y de lo que debo."],t:["Empieza hoy: anota cada día lo que entra y lo que sale, en un cuaderno o una hoja de cálculo.","Ya tienes base. Calcula el costo real de tus productos y revisa tus precios cada mes.","Muy bien. Mantén tu control semanal y compara tus resultados mes a mes."]},
{n:"Ventas y clientes",q:["Sé cuáles son los productos o servicios que más ganancia me dejan.","Ningún cliente por sí solo representa más de la mitad de mis ventas.","Sé por qué me compran a mí y no a mi competencia.","Tengo un registro de mis clientes (nombre, contacto, qué compran).","Consigo clientes nuevos de forma constante (redes, referidos, publicidad).","Casi todos mis clientes me pagan dentro del plazo acordado."],t:["Haz una lista de tus clientes con teléfono, qué compran y cuándo compraron por última vez.","Tienes clientes, pero falta orden. Define cómo consigues clientes nuevos y cómo das seguimiento.","Buen trabajo. Cuida a tus mejores clientes y no dependas de pocos."]},
{n:"Operaciones y proveedores",q:["Sé cuánto inventario o material tengo y qué debo comprar pronto.","Para lo más importante, tengo al menos dos proveedores posibles.","Mis tareas principales están explicadas de forma que otra persona podría hacerlas.","Entrego mis productos o servicios a tiempo casi siempre.","Anoto los reclamos de mis clientes y les doy respuesta.","Detecto pérdidas, mermas o errores antes de que se hagan grandes."],t:["Escribe los 5 pasos de tu tarea más importante y busca un segundo proveedor para tu insumo principal.","Tu operación funciona, pero depende de la memoria. Documenta los procesos y controla el inventario.","Tu operación está ordenada. Mide tiempos de entrega y reclamos para seguir mejorando."]},
{n:"Equipo y organización",q:["Cada persona sabe qué le toca hacer y ante quién responde.","Mi negocio puede funcionar unos días sin que yo esté presente.","Pago a mi equipo en el tiempo y la forma acordados.","Cuando entra alguien nuevo, le explico y le capacito su trabajo.","Me reúno con mi equipo de forma regular para revisar cómo vamos.","Si una persona clave se va, sé quién podría reemplazarla."],t:["Define por escrito qué hace cada persona y quién responde ante quién.","Hay estructura, pero dependes mucho de ti. Delega funciones y haz reuniones regulares.","Tu equipo está organizado. Piensa ahora en capacitación y en quién reemplaza a quién."]},
{n:"Formalidad, tecnología y continuidad",q:["Mis impuestos, permisos y licencias están al día.","Tengo por escrito los acuerdos con clientes, proveedores y empleados.","Hago copia de seguridad de mi información importante (ventas, clientes, cuentas).","Uso contraseñas seguras y sé quién tiene acceso a qué.","Si se va la luz o el internet, mi negocio puede seguir vendiendo.","Tengo por escrito hacia dónde quiero llevar mi negocio este año."],t:["Haz hoy una copia de tu información importante y revisa las fechas de vencimiento de tus permisos e impuestos.","Vas por buen camino. Formaliza los acuerdos por escrito y prepara un plan para los cortes de luz e internet.","Muy bien. Revisa cada año tu plan de continuidad y tus metas."]}
];
