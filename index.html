<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="SumaTips Consulting Group: diagnóstico y acompañamiento para ordenar la gestión de pequeñas y medianas empresas.">
<title>SumaTips Consulting Group | Claridad para crecer</title>
<style>
:root{
  --blue:#082b68;
  --cyan:#159fc1;
  --gold:#d6a43b;
  --bg:#f5f7fb;
  --text:#243247;
  --red:#dc2626;
  --yellow:#d97706;
  --green:#16a34a;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:100px}
body{margin:0;background:var(--bg);font:17px/1.6 system-ui,-apple-system,sans-serif;color:var(--text)}
a{color:var(--blue)}
.wrap{max-width:1160px;margin:auto;padding:0 24px}
header{background:white;position:sticky;top:0;z-index:10;box-shadow:0 2px 12px #082b6810}
nav{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:88px;flex-wrap:wrap;padding:12px 0}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;font-weight:800;color:var(--blue)}
.brand img{width:75px;height:55px;object-fit:contain;background:transparent}
.links{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.links a{text-decoration:none;font-size:14px}
h1,h2,h3{color:var(--blue);line-height:1.15}
h1{font-size:clamp(36px,5vw,60px);letter-spacing:-1.5px}
h2{font-size:clamp(26px,4vw,38px)}
h3{font-size:20px}
section{padding:72px 0}
.hero{background:linear-gradient(135deg,#fff,#e8f3fa)}
.hero-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:48px;align-items:center}
.tag{color:#086880;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:2px}
.lead{font-size:19px}
.btn,button{display:inline-block;background:var(--blue);color:white;border:0;border-radius:8px;padding:13px 22px;text-decoration:none;font:600 15px system-ui;cursor:pointer;transition:background .2s}
.btn:hover,button:hover{opacity:.95}
.btn.secondary{background:white;color:var(--blue);border:1px solid var(--blue)}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}
.card{background:white;border:1px solid #dfe6ee;border-radius:16px;padding:26px;box-shadow:0 8px 24px #082b6808}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.two{grid-template-columns:repeat(2,1fr)}
.four{grid-template-columns:repeat(4,1fr)}
.line{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #e5eaf0;padding:16px 0}
.dot{width:10px;height:10px;background:var(--cyan);border-radius:50%;display:inline-block;margin-right:8px}
.dark{background:var(--blue);color:white}
.dark h2,.dark h3{color:white}
.dark .tag{color:#8de0f0}
.num{font-size:32px;color:var(--cyan);font-weight:800}
.muted,small{font-size:14px;color:#536176}

fieldset{border:1px solid #dce4ed;border-radius:12px;margin:22px 0;padding:22px;background:#ffffff}
legend{font-weight:800;color:var(--blue);padding:0 8px}
.question-item{padding:14px 0;border-bottom:1px solid #edf2f7}
.question-item:last-child{border-bottom:0}
.question-text{display:block;margin-bottom:10px;font-weight:600}
.bool-options{display
